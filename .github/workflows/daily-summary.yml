name: Daily Horizon Summary

on:
  schedule:
    # GitHub scheduled workflows use UTC. 23:30 UTC is 07:30 Asia/Shanghai;
    # this intentionally runs early to offset the observed schedule delay.
    - cron: '30 23 * * *'
  workflow_dispatch:      # Allow manual trigger

jobs:
  daily-summary:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed to commit changes

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"

      - name: Install dependencies
        run: uv sync

      - name: Prepare GitHub Actions config
        run: cp data/config.github.json data/config.json

      - name: Run Horizon
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          LWN_KEY: ${{ secrets.LWN_KEY }}
          LWN_BRIEFING_URL: ${{ vars.LWN_BRIEFING_URL }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: uv run horizon

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: daily summary $(date -u +%Y-%m-%d)"
          # Push and ignore "already up to date" errors
          git push || true
